name: MiniRL PT - preparar corpus 150k

on:
  push:
    branches:
      - codex/minirl-150k-corpus-github-actions
    paths:
      - .github/workflows/mini-rl-corpus-150k.yml
      - scripts/prepare_150k.py
      - .github/workflows/requirements-minirl.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/workflows/requirements-minirl.txt
      - name: Install dependencies
        run: python -m pip install -r .github/workflows/requirements-minirl.txt
      - name: Prepare 153000 unique pairs
        run: python scripts/prepare_150k.py --out corpus_150k_pt --train 150000 --validation 1500 --test 1500
      - name: Validate manifest
        run: |
          python - <<'PY'
          import json
          m=json.load(open('corpus_150k_pt/manifest.json',encoding='utf-8'))
          assert m['status']=='complete' and m['counts']=={'train':150000,'validation':1500,'test':1500},m
          print('Complete dataset, verified split counts')
          PY
      - name: Create zip
        run: zip -9 -q -r MiniRL-Corpus-PT-150K.zip corpus_150k_pt
      - name: Upload training corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniRL-Corpus-PT-150K
          path: MiniRL-Corpus-PT-150K.zip
          if-no-files-found: error
          retention-days: 7
